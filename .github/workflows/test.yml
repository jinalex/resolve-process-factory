name: test
# Pushes to main and every PR, but not for changes that only touch the docs, which no test reads.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "README.md", "AGENTS.md", "CLAUDE.md", ".github/pull_request_template.md"]
  pull_request:
    paths-ignore: ["docs/**", "README.md", "AGENTS.md", "CLAUDE.md", ".github/pull_request_template.md"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
