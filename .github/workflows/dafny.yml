name: dafny
# The evaluator's proofs: verify them, recompile, and fail if the committed evaluate.cjs is out of date.
# Only the Dafny source, its build script and the toolchain can change that, so run only when they do.
on:
  push:
    branches: [main]
    paths: ["core/dafny/**", "package.json", "pnpm-lock.yaml", ".nvmrc", ".github/workflows/dafny.yml"]
  pull_request:
    paths: ["core/dafny/**", "package.json", "pnpm-lock.yaml", ".nvmrc", ".github/workflows/dafny.yml"]
jobs:
  dafny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Install Dafny 4.11.0 (bundles its own .NET runtime and Z3)
        run: |
          curl -fsSL -o dafny.zip https://github.com/dafny-lang/dafny/releases/download/v4.11.0/dafny-4.11.0-x64-ubuntu-22.04.zip
          echo "a46a9ff7cdd720f7955854c78e95df13f4cfe6b80691b05f8654fe19e8267179  dafny.zip" | sha256sum -c -
          unzip -q dafny.zip -d "$RUNNER_TEMP" && echo "$RUNNER_TEMP/dafny" >> "$GITHUB_PATH"
      - run: pnpm build-dafny --check
