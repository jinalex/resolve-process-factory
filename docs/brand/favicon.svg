<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- One look in both themes: a white tile reads on light and dark tabs, and a dark R on it stays visible. -->
  <rect width="32" height="32" rx="4" fill="#ffffff"/>
  <rect x="3" y="15" width="26" height="13" fill="#ffe36e"/>
  <text x="16" y="26" text-anchor="middle" font-family="Public Sans, Helvetica Neue, Arial, sans-serif" font-weight="800" font-size="24" fill="#17202b">R</text>
</svg>
